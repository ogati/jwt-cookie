spring.application.name=employee-api-with-jwt

spring.datasource.url=jdbc:h2:mem:employee_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pagination. No need to set default page number and page size as PageableDefault does it
spring.data.web.pageable.max-page-size=100

jwt.secret=Qd7J3mL9xP2vK8sN4rT6yU1zW5aBcDeFgHiJkLmNoP0=
jwt.expiration=3600000

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG
